<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff5c9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TO DO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="chipmunk-180.png">
<link rel="icon" type="image/png" href="chipmunk-192.png">
<title>클로이의 TO DO LIST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:"MemomentKkukkukk";
    src:local("Memoment Kkukkukk"), local("MemomentKkukkukk"), local("메모먼트 꾹꾹체"),
        url("fonts/MemomentKkukkukk.woff2") format("woff2");
    font-display:swap;
  }
  /* 레이아웃: PC 전체 화면 = 왼쪽 큰 월간 캘린더 + 오른쪽 선택한 날의 할 일 패널, 리포트는 별도 탭 */
  :root{
    --bg:#ffe3ee; --card:#ffffff; --ink:#4a1f35; --muted:#9a6b82;
    --accent:#ff5c9d; --accent-d:#e0457f; --line:#f7d3e2; --soft:#fff3f8;
    --high:#e5383b; --mid:#ff8fb8; --low:#b79cff; --good:#1f9d6b; --warn:#d97706;
    --font:"MemomentKkukkukk","Gaegu",-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font); background:var(--bg); color:var(--ink); line-height:1.5; word-break:keep-all}
  button, input, select, textarea{font-family:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent-d); outline-offset:2px}

  .app{max-width:1600px; margin:0 auto; padding:16px 16px 32px; display:flex; flex-direction:column; gap:14px; min-height:100%}

  /* 헤더 */
  .top{display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px}
  .brand{font-size:26px; white-space:nowrap}
  .quote{flex:1 1 320px; min-width:0; background:var(--soft); border:1.5px solid var(--line); border-radius:14px; padding:6px 14px; cursor:pointer; text-align:center}
  .quote .q{font-size:15px}
  .quote .by{font-size:12px; color:var(--muted)}
  .tabs{display:flex; gap:6px}
  .tab, .iconbtn{width:46px; height:46px; border-radius:50%; border:1.5px solid var(--line); background:#fff; font-size:21px; line-height:1; padding:0; display:inline-flex; align-items:center; justify-content:center; flex:none}
  .tab.on{background:var(--ink); border-color:var(--ink); color:#fff}
  .iconbtn:hover, .tab:hover{border-color:var(--accent)}

  /* 실행 중 타이머 바 */
  .runbar{position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;
    background:var(--ink); color:#fff; border-radius:14px; padding:10px 16px}
  .runbar[hidden]{display:none}
  .runbar .name{font-size:17px; font-weight:700; min-width:0; overflow-wrap:anywhere}
  .runbar .clock{font-size:22px; font-variant-numeric:tabular-nums}
  .runbar .meter{flex:1 1 160px; height:8px; background:rgba(255,255,255,.25); border-radius:999px; overflow:hidden}
  .runbar .meter i{display:block; height:100%; background:var(--mid); border-radius:999px}
  .runbar .meter.over i{background:#ffb4b4}
  .runbar .hint{font-size:13px; opacity:.85}
  .runbar button{border:0; border-radius:10px; padding:7px 14px; font-weight:700; font-size:14px}
  .runbar .stop{background:#fff; color:var(--ink)}
  .runbar .done{background:var(--accent); color:#fff}

  .card{background:var(--card); border-radius:18px; padding:18px; box-shadow:0 8px 30px rgba(255,92,157,.18); min-width:0}
  h2{font-size:20px; text-wrap:balance}
  .sub{color:var(--muted); font-size:13px}

  /* 캘린더 화면 */
  .main{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:14px; align-items:start}
  .calhead{display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:12px}
  .calhead h2{font-size:24px; margin-right:auto}
  .nav{display:flex; gap:6px}
  .nav button{border:1.5px solid var(--line); background:#fff; color:var(--muted); border-radius:10px; padding:5px 12px; font-weight:700; display:inline-flex; align-items:center}
  .nav button:hover{border-color:var(--accent); color:var(--accent-d)}
  select.view{border:1.5px solid var(--line); border-radius:10px; background:var(--soft); padding:6px 10px; font-size:14px; max-width:100%}
  .grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px}
  .dow{text-align:center; font-size:12px; font-weight:700; color:var(--muted)}
  .dow.sun{color:var(--high)}
  .day{min-height:112px; border:1.5px solid var(--line); border-radius:10px; background:#fff; padding:4px; text-align:left;
    display:flex; flex-direction:column; gap:3px; min-width:0}
  .day.other{background:var(--soft); opacity:.55}
  .day.sel{border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent)}
  .day .num{font-size:13px; font-weight:700; padding:0 4px; align-self:flex-start; border-radius:999px}
  .day.sun .num{color:var(--high)}
  .day.today .num{background:var(--accent); color:#fff}
  .chip{display:block; font-size:12px; line-height:1.35; padding:1px 6px; border-radius:6px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chip.done{opacity:.4; text-decoration:line-through}
  .more{font-size:11px; color:var(--muted); padding-left:4px}
  .legend{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; margin-top:10px; font-size:12px; color:var(--muted)}
  .legend button{display:inline-flex; align-items:center; gap:4px; border:1.5px solid transparent; background:none; border-radius:999px; padding:2px 9px; font-size:12px; color:var(--muted)}
  .legend button:hover{border-color:var(--line)}
  .legend button.on{border-color:var(--accent); background:var(--soft); color:var(--ink); font-weight:700}
  .legend.filtering button:not(.on):not(.clear){opacity:.45}
  .legend .clear{color:var(--accent-d); text-decoration:underline}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%}

  /* 오른쪽 패널 */
  .leftcol{display:flex; flex-direction:column; gap:14px; min-width:0}
  .memo-area{display:block; min-height:170px; resize:vertical; margin-top:10px; font-size:15px; line-height:1.6}
  .day .num.hasmemo::after{content:""; display:inline-block; width:6px; height:6px; margin-left:4px; border-radius:50%; background:var(--ink); vertical-align:middle}
  .day.today .num.hasmemo::after{background:#fff}
  .side{display:flex; flex-direction:column; gap:12px; position:sticky; top:12px}
  .dayhead{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap}
  .seg{display:flex; gap:4px}
  .seg button{border:1.5px solid var(--line); background:#fff; color:var(--muted); border-radius:9px; padding:4px 10px; font-size:13px; font-weight:700}
  .seg button.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .addbtn{width:100%; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; padding:10px}
  .addbtn:hover{background:var(--accent-d)}
  form.add{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  form.add[hidden]{display:none}
  form.add .full{grid-column:1/-1}
  form.add label{display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--muted); min-width:0}
  .field{width:100%; min-width:0; padding:9px 10px; font-size:15px; border:1.5px solid var(--line); border-radius:10px; background:var(--soft)}
  .field:focus{outline:none; border-color:var(--accent)}
  .hintline{font-size:12px; color:var(--accent-d); min-height:1.2em}
  ul{list-style:none}
  .task{border-bottom:1px solid var(--line); padding:10px 2px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 10px; align-items:start}
  .task input[type=checkbox]{width:20px; height:20px; accent-color:var(--accent); margin-top:2px}
  .task .t{font-size:16px; overflow-wrap:anywhere}
  .task.done .t{color:var(--muted); text-decoration:line-through}
  .task.running{background:var(--soft); border-radius:10px}
  .meta{display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-top:3px; font-size:12px; color:var(--muted)}
  select.pill{border:0; border-radius:999px; color:#fff; font-size:11px; font-weight:700; padding:1px 4px; cursor:pointer; max-width:9em}
  select.pill option{color:var(--ink); background:#fff}
  .p-high{background:var(--high)} .p-mid{background:var(--mid)} .p-low{background:var(--low)}
  .overdue{color:var(--high); font-weight:700}
  .timerow{grid-column:2/-1; display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12px; color:var(--muted)}
  .timerow input{width:58px; padding:3px 6px; font-size:13px; border:1.5px solid var(--line); border-radius:8px; background:#fff; font-variant-numeric:tabular-nums}
  .play{border:1.5px solid var(--accent); background:#fff; color:var(--accent-d); border-radius:8px; padding:2px 10px; font-size:13px; font-weight:700}
  .play.on{background:var(--accent); color:#fff}
  .x{border:0; background:none; color:var(--muted); font-size:18px; line-height:1; padding:2px 6px}
  .x:hover{color:var(--accent-d)}
  .empty{text-align:center; color:var(--muted); padding:22px 0; font-size:14px}
  .link{border:0; background:none; color:var(--muted); font-size:12px; text-decoration:underline; margin-top:8px}

  /* 리포트 */
  .report{display:flex; flex-direction:column; gap:14px}
  .report[hidden], .main[hidden]{display:none}
  .rhead{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
  .rhead h2{font-size:24px; margin-right:auto}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px}
  .kpi{background:var(--soft); border-radius:14px; padding:12px 14px}
  .kpi .l{font-size:13px; color:var(--muted)}
  .kpi .v{font-size:28px; font-variant-numeric:tabular-nums}
  .kpi .d{font-size:12px; color:var(--muted)}
  .up{color:var(--good)} .down{color:var(--high)}
  .insights{display:flex; flex-direction:column; gap:8px; font-size:15px}
  .insights li{padding-left:18px; position:relative}
  .insights li::before{content:""; position:absolute; left:4px; top:.6em; width:6px; height:6px; border-radius:50%; background:var(--accent)}
  .two{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:14px}
  .bars{display:flex; flex-direction:column; gap:8px}
  .bar{display:grid; grid-template-columns:minmax(80px,9em) minmax(0,1fr); gap:8px; align-items:center; font-size:13px}
  .bar .lab{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .bar .track{position:relative; height:22px}
  .bar .fill{height:22px; border-radius:0 4px 4px 0; background:var(--accent); min-width:2px}
  .bar .val{position:absolute; top:2px; font-size:12px; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums}
  .tbl{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums}
  .tbl th, .tbl td{padding:6px 8px; border-bottom:1px solid var(--line); text-align:right}
  .tbl th:first-child, .tbl td:first-child{text-align:left}
  .tbl th{color:var(--muted); font-weight:700}
  .scroll{overflow-x:auto}

  /* 설정, 확인창, 토스트 */
  .modal{position:fixed; inset:0; background:rgba(74,31,53,.35); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20}
  .modal[hidden]{display:none}
  .sheet{background:#fff; border-radius:18px; padding:20px; width:min(560px,100%); max-height:90vh; overflow:auto; display:flex; flex-direction:column; gap:14px}
  .sheet h3{font-size:16px}
  .row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:14px}
  .row input[type=number]{width:90px}
  .row input[type=time]{width:150px}
  .btn{border:1.5px solid var(--line); background:#fff; border-radius:10px; padding:6px 12px; font-size:14px; font-weight:700}
  .btn.pri{background:var(--accent); border-color:var(--accent); color:#fff}
  .clientrow{display:flex; gap:8px; align-items:center}
  .clientrow input[type=color]{width:34px; height:34px; border:1.5px solid var(--line); border-radius:50%; padding:0; background:none}
  .clientrow .field{padding:6px 10px}
  .toasts{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:30; max-width:min(380px,calc(100vw - 32px))}
  .toast{background:var(--ink); color:#fff; border-radius:12px; padding:12px 14px; box-shadow:0 8px 24px rgba(0,0,0,.2); font-size:14px}
  .toast b{display:block; font-size:15px}
  .toast .acts{display:flex; gap:6px; margin-top:8px}
  .toast .acts button{border:0; border-radius:8px; padding:5px 10px; font-weight:700; font-size:13px}

  @media (max-width: 980px){
    .main{grid-template-columns:1fr}
    .side{position:static}
    .day{min-height:74px}
    .chip{font-size:11px; padding:0 4px}
  }
  @media (max-width: 560px){
    .brand{font-size:22px}
    .day{min-height:56px}
    .chip{height:6px; padding:0; font-size:0}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">👧 클로이의 TO DO LIST</h1>
    <button class="quote" type="button" id="quote" title="눌러서 다른 명언 보기">
      <div class="q" id="qText"></div>
      <div class="by" id="qBy"></div>
    </button>
    <nav class="tabs" aria-label="화면">
      <button class="tab on" type="button" data-view="cal" aria-label="캘린더" title="캘린더">📅</button>
      <button class="tab" type="button" data-view="report" aria-label="월간 리포트" title="월간 리포트">📊</button>
    </nav>
    <button class="iconbtn" type="button" id="openSettings" aria-label="설정" title="설정">⚙️</button>
  </header>

  <div class="runbar" id="runbar" hidden>
    <span class="name" id="runName"></span>
    <span class="clock" id="runClock">0:00</span>
    <span class="meter" id="runMeter"><i id="runFill" style="width:0"></i></span>
    <span class="hint" id="runHint"></span>
    <button class="stop" type="button" id="runStop">⏸ 멈춤</button>
    <button class="done" type="button" id="runDone">✔ 완료</button>
  </div>

  <!-- 캘린더 화면 -->
  <section class="main" id="viewCal">
    <div class="leftcol">
    <div class="card">
      <div class="calhead">
        <h2 id="calTitle"></h2>
        <div class="nav">
          <button type="button" id="prev" aria-label="이전 달"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2L4 7l5 5"/></svg></button>
          <button type="button" id="todayBtn">오늘</button>
          <button type="button" id="next" aria-label="다음 달"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2l5 5-5 5"/></svg></button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <div class="dayhead"><h2 id="memoTitle"></h2><span class="sub" id="memoSaved" aria-live="polite"></span></div>
      <textarea class="field memo-area" id="memo" placeholder="이 날의 메모를 자유롭게 적어보세요. 자동으로 저장돼요."></textarea>
    </div>
    </div>

    <aside class="side">
      <div class="card">
        <div class="dayhead">
          <h2 id="dayTitle"></h2>
        </div>
        <div style="margin-top:10px; display:flex; flex-direction:column; gap:10px">
          <button class="addbtn" type="button" id="addToggle" aria-expanded="false">+ 할 일 추가</button>
          <form class="add" id="addForm" hidden>
            <input class="field full" id="fText" placeholder="할 일을 입력하세요" maxlength="200" autocomplete="off" aria-label="할 일">
            <label>날짜<input class="field" type="date" id="fDue"></label>
            <label>마감 시간 (선택)<input class="field" type="time" id="fTime"></label>
            <label>카테고리<select class="field" id="fCat"></select></label>
            <label id="fClientWrap">광고주<select class="field" id="fClient"></select></label>
            <label>우선순위<select class="field" id="fPrio"><option value="high">높음</option><option value="mid" selected>보통</option><option value="low">낮음</option></select></label>
            <label>예상 시간 (분)<input class="field" type="number" min="1" step="1" id="fEst" placeholder="비우면 평소 기록"></label>
            <p class="hintline full" id="fHint"></p>
            <button class="addbtn full" type="submit">추가</button>
          </form>
          <div class="seg" id="status">
            <button type="button" data-f="all" class="on">전체</button>
            <button type="button" data-f="active">진행중</button>
            <button type="button" data-f="done">완료</button>
          </div>
        </div>
        <ul id="list"></ul>
      </div>
    </aside>
  </section>

  <!-- 월간 리포트 -->
  <section class="report" id="viewReport" hidden>
    <div class="rhead">
      <h2 id="rTitle"></h2>
      <div class="nav">
        <button type="button" id="rPrev" aria-label="이전 달"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2L4 7l5 5"/></svg></button>
        <button type="button" id="rNext" aria-label="다음 달"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2l5 5-5 5"/></svg></button>
      </div>
    </div>
    <div class="kpis" id="rKpis"></div>
    <div class="card">
      <h2>💡 인사이트</h2>
      <ul class="insights" id="rInsights" style="margin-top:10px"></ul>
    </div>
    <div class="two">
      <div class="card">
        <h2>⏱ 어디에 시간을 썼나</h2>
        <div class="bars" id="rBars" style="margin-top:12px"></div>
      </div>
      <div class="card">
        <h2>🔁 반복하는 일, 빨라졌나</h2>
        <div class="scroll" style="margin-top:12px"><table class="tbl" id="rRepeat"></table></div>
      </div>
    </div>
  </section>
</div>

<!-- 설정 -->
<div class="modal" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="sheet">
    <div class="row" style="justify-content:space-between"><h2 id="setTitle">⚙️ 설정</h2><button class="x" type="button" id="closeSettings" aria-label="닫기">×</button></div>

    <section style="display:flex; flex-direction:column; gap:8px">
      <h3>🔔 알림</h3>
      <div class="row"><span id="permText"></span><button class="btn pri" type="button" id="askPerm">알림 켜기</button><button class="btn" type="button" id="testNotify">테스트</button></div>
      <p class="sub">앱(또는 크롬)이 켜져 있을 때만 알림이 와요. 창을 최소화해 둬도 괜찮아요.</p>
      <div class="row">마감 미리 알림:
        <label><input type="checkbox" class="off" value="2880"> 2일 전</label>
        <label><input type="checkbox" class="off" value="1440"> 1일 전</label>
        <label><input type="checkbox" class="off" value="180"> 3시간 전</label>
        <label><input type="checkbox" class="off" value="60"> 1시간 전</label>
      </div>
      <div class="row"><label for="sDueTime">마감 시간을 안 적었을 때 기준</label><input class="field" type="time" id="sDueTime"></div>
      <div class="row"><label for="sWarn">작업 중, 평소 시간 끝나기</label><input class="field" type="number" min="1" max="60" id="sWarn"> 분 전에 알림</div>
      <div class="row"><label><input type="checkbox" id="sSound"> 알림 소리</label></div>
    </section>

    <section style="display:flex; flex-direction:column; gap:8px">
      <h3>🏢 광고주 (업무 아래)</h3>
      <div id="clientRows" style="display:flex; flex-direction:column; gap:6px"></div>
      <form class="clientrow" id="clientForm">
        <input type="color" id="newClientColor" value="#ff5c9d" aria-label="색상">
        <input class="field" id="newClientName" placeholder="새 광고주 이름" maxlength="30" autocomplete="off">
        <button class="btn pri" type="submit">추가</button>
      </form>
    </section>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
  var KEY = 'todo-list-v2';
  var DEFAULT_CATS = [
    { id: 'work', name: '업무', color: '#ff5c9d' },
    { id: 'study', name: '공부', color: '#a78bfa' },
    { id: 'health', name: '운동', color: '#34c4a0' },
    { id: 'life', name: '생활', color: '#f59e0b' },
    { id: 'etc', name: '기타', color: '#94a3b8' }
  ];
  var CLIENT_COLORS = ['#e0457f', '#7c5cff', '#0ea5a0', '#f97316', '#2563eb', '#c026d3', '#65a30d', '#b45309'];
  var DEFAULT_SETTINGS = { notify: false, sound: true, warnMin: 5, offsets: [1440, 120], dueTime: '18:00' };
  var PRIO = { high: ['높음', 0], mid: ['보통', 1], low: ['낮음', 2] };
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];

  var state = { todos: [], missed: [], cats: DEFAULT_CATS, clients: [], settings: {}, active: null, memos: {} };
  try {
    var raw = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(raw)) state.todos = raw;
    else if (raw) {
      state.todos = raw.todos || [];
      state.missed = raw.missed || [];
      state.cats = raw.cats || DEFAULT_CATS;
      state.clients = raw.clients || [];
      state.settings = raw.settings || {};
      state.active = raw.active || null;
      state.memos = raw.memos || {};
    }
  } catch (e) {}
  Object.keys(DEFAULT_SETTINGS).forEach(function (k) { if (state.settings[k] === undefined) state.settings[k] = DEFAULT_SETTINGS[k]; });
  state.todos.forEach(function (t) {
    if (!t.id) t.id = uid();
    if (!t.prio) t.prio = 'mid';
    if (t.cat === undefined) t.cat = '';
    if (!t.client) t.client = '';
    if (!t.spentMin) t.spentMin = 0;
    if (!t.log) t.log = [];
    if (!t.notified) t.notified = {};
  });

  var $ = function (id) { return document.getElementById(id); };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return ymd(new Date()); }
  function md(key) { var q = key.split('-'); return (+q[1]) + '월 ' + (+q[2]) + '일'; }
  function fmtMin(m) {
    m = Math.round(m);
    if (m < 60) return m + '분';
    return Math.floor(m / 60) + '시간' + (m % 60 ? ' ' + (m % 60) + '분' : '');
  }
  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? h + ':' + pad(m) : m) + ':' + pad(s);
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  function catById(id) {
    for (var i = 0; i < state.cats.length; i++) if (state.cats[i].id === id) return state.cats[i];
    return { id: '', name: '미분류', color: '#94a3b8' };
  }
  function clientById(id) {
    for (var i = 0; i < state.clients.length; i++) if (state.clients[i].id === id) return state.clients[i];
    return null;
  }
  // 업무 + 광고주면 광고주 색/이름, 아니면 카테고리
  function groupOf(t) {
    var c = t.cat === 'work' && clientById(t.client);
    if (c) return { key: 'c:' + c.id, name: c.name, color: c.color };
    var k = catById(t.cat);
    return { key: 'k:' + (k.id || 'none') + (t.cat === 'work' ? ':noclient' : ''), name: t.cat === 'work' ? '업무 (광고주 없음)' : k.name, color: k.color };
  }
  function norm(s) { return (s || '').trim().toLowerCase().replace(/\s+/g, ' '); }

  // ---------- 시간 계산 ----------
  function elapsedMin(t) {
    var m = t.spentMin || 0;
    if (state.active && state.active.id === t.id) m += (Date.now() - state.active.start) / 60000;
    return m;
  }
  // 평소 걸린 시간: 같은 이름 > 같은 광고주 > 같은 카테고리 순으로 완료 기록의 평균
  function learned(t, exceptId) {
    var done = state.todos.filter(function (x) { return x.done && x.spentMin >= 1 && x.id !== exceptId; });
    var pick = function (arr, label) {
      if (!arr.length) return null;
      var sum = arr.reduce(function (a, x) { return a + x.spentMin; }, 0);
      return { min: Math.round(sum / arr.length), n: arr.length, label: label };
    };
    var same = done.filter(function (x) { return norm(x.text) === norm(t.text); });
    if (same.length) return pick(same, '같은 이름의 일');
    if (t.cat === 'work' && t.client) {
      var c = done.filter(function (x) { return x.cat === 'work' && x.client === t.client; });
      if (c.length >= 2) return pick(c, (clientById(t.client) || {}).name + ' 업무');
    }
    var k = done.filter(function (x) { return x.cat === t.cat; });
    if (k.length >= 2) return pick(k, catById(t.cat).name + ' 일');
    return null;
  }
  function expectedMin(t) {
    if (t.estMin) return t.estMin;
    var l = learned(t, t.id);
    return l ? l.min : null;
  }

  // ---------- 알림 ----------
  var audioCtx = null;
  document.addEventListener('pointerdown', function () {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  }, { once: true });
  function beep() {
    if (!state.settings.sound || !audioCtx) return;
    try {
      [0, 0.25].forEach(function (off) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        var t0 = audioCtx.currentTime + off;
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
        o.start(t0); o.stop(t0 + 0.22);
      });
    } catch (e) {}
  }
  function toast(title, body, actions, sticky) {
    var box = el('div', 'toast');
    box.appendChild(el('b', '', title));
    if (body) box.appendChild(el('span', '', body));
    var close = function () { if (box.parentNode) box.parentNode.removeChild(box); };
    if (actions && actions.length) {
      var acts = el('div', 'acts');
      actions.forEach(function (a) {
        var b = el('button', '', a[0]); b.type = 'button';
        b.style.background = a[2] ? 'var(--accent)' : '#fff'; b.style.color = a[2] ? '#fff' : 'var(--ink)';
        b.onclick = function () { close(); a[1](); };
        acts.appendChild(b);
      });
      box.appendChild(acts);
    }
    var tw = $('toasts'); tw.appendChild(box);
    while (tw.children.length > 4) tw.removeChild(tw.firstChild);
    if (!sticky) setTimeout(close, 9000);
  }
  function notify(title, body, actions, sticky) {
    toast(title, body, actions, sticky);
    beep();
    if (state.settings.notify && 'Notification' in window && Notification.permission === 'granted' && document.hidden) {
      try { new Notification(title, { body: body, icon: 'chipmunk-192.png', tag: title }); } catch (e) {}
    }
  }

  function dueAt(t) {
    var time = t.dueTime || state.settings.dueTime || '18:00';
    return new Date(t.due + 'T' + time + ':00').getTime();
  }
  function offLabel(min) { return min >= 1440 ? (min / 1440) + '일' : min >= 60 ? (min / 60) + '시간' : min + '분'; }
  // 마감 알림: 지난 알림이 여러 개면 가장 가까운 하나만 보내고 나머지는 보낸 것으로 처리
  function checkDeadlines() {
    var now = Date.now(), changed = false;
    var offs = state.settings.offsets.slice().sort(function (a, b) { return b - a; });
    state.todos.forEach(function (t) {
      if (t.done || !t.due) return;
      var at = dueAt(t);
      if (now >= at) return;
      var due = offs.filter(function (o) { return now >= at - o * 60000 && !t.notified[o]; });
      if (!due.length) return;
      due.forEach(function (o) { t.notified[o] = true; });
      changed = true;
      var left = (at - now) / 60000;
      notify('📅 ' + t.text + ' · 마감 ' + (left >= 1440 ? Math.round(left / 1440) + '일' : fmtMin(left)) + ' 전', '',
        [['지금 시작', function () { startTimer(t); }, true], ['닫기', function () {}]], true);
    });
    if (changed) save();
  }

  // ---------- 타이머 ----------
  function startTimer(t) {
    if (state.active && state.active.id === t.id) return;
    if (state.active) stopTimer();
    state.active = { id: t.id, start: Date.now(), extra: 0, warned: false, over: false };
    if (!state.settings.notify && 'Notification' in window && Notification.permission === 'default') {
      toast('🔔 알림을 켜 두면 좋아요', '시간이 다 되어 갈 때 다른 창을 보고 있어도 알려드려요.', [['알림 켜기', askPermission, true]]);
    }
    save(); renderAll();
  }
  function stopTimer() {
    var a = state.active; if (!a) return;
    var t = byId(a.id);
    if (t) {
      var add = (Date.now() - a.start) / 60000;
      t.spentMin = (t.spentMin || 0) + add;
      t.log.push({ date: today(), min: Math.round(add * 10) / 10 });
    }
    state.active = null;
    save();
  }
  function completeTask(t) {
    if (state.active && state.active.id === t.id) stopTimer();
    t.done = true; t.doneAt = today();
    var exp = expectedMin(t);
    if (t.spentMin >= 1) {
      var msg = fmtMin(t.spentMin) + ' 걸렸어요' + (exp ? ' (예상 ' + fmtMin(exp) + ')' : '');
      toast('✔ ' + t.text, msg);
    }
    save(); renderAll();
  }
  function byId(id) { for (var i = 0; i < state.todos.length; i++) if (state.todos[i].id === id) return state.todos[i]; return null; }

  function tick() {
    var a = state.active;
    if (!a) { $('runbar').hidden = true; return; }
    var t = byId(a.id);
    if (!t) { state.active = null; save(); $('runbar').hidden = true; return; }
    $('runbar').hidden = false;
    var el2 = elapsedMin(t), exp = expectedMin(t);
    $('runName').textContent = '⏱ ' + t.text;
    $('runClock').textContent = fmtClock(el2 * 60);
    if (exp) {
      var target = exp + (a.extra || 0);
      var pct = Math.min(100, el2 / target * 100);
      $('runFill').style.width = pct + '%';
      $('runMeter').className = 'meter' + (el2 > target ? ' over' : '');
      var left = target - el2;
      $('runHint').textContent = left >= 0 ? '평소 ' + fmtMin(exp) + ' · ' + Math.ceil(left) + '분 남음' : '평소보다 ' + Math.ceil(-left) + '분 넘음';
      if (!a.warned && left <= state.settings.warnMin && left > 0) {
        a.warned = true; save();
        notify('⏰ ' + Math.ceil(left) + '분 남았어요', '"' + t.text + '" 평소 ' + fmtMin(exp) + ' 걸리던 일이에요. 마무리해 볼까요?', [['확인', function () {}, true]], true);
      }
      if (!a.over && left <= 0) {
        a.over = true; save();
        notify('⌛ 평소 시간이 다 됐어요', '"' + t.text + '" 다 끝났나요?', [
          ['다 했어요', function () { completeTask(t); }, true],
          ['10분 더', function () { if (state.active) { state.active.extra = (state.active.extra || 0) + 10; state.active.over = false; state.active.warned = false; save(); } }],
          ['계속', function () {}]
        ], true);
      }
    } else {
      $('runFill').style.width = '0';
      $('runHint').textContent = '평소 기록이 없어요. 끝나면 이 시간이 기준이 돼요.';
    }
  }

  // ---------- 화면 상태 ----------
  var view = 'cal', status = 'all';
  var catPick = '';                              // 범례에서 고른 카테고리/광고주 (비어 있으면 전체)
  var sel = today();
  var viewY = new Date().getFullYear(), viewM = new Date().getMonth();
  var rY = viewY, rM = viewM;



  function renderCal() {
    $('calTitle').textContent = '📅 ' + viewY + '년 ' + (viewM + 1) + '월';
    var grid = $('grid'); grid.innerHTML = '';
    DOW.forEach(function (d, i) { grid.appendChild(el('div', 'dow' + (i === 0 ? ' sun' : ''), d)); });
    var first = new Date(viewY, viewM, 1);
    var start = new Date(viewY, viewM, 1 - first.getDay());
    var weeks = Math.ceil((first.getDay() + new Date(viewY, viewM + 1, 0).getDate()) / 7);
    var byDay = {};
    state.todos.forEach(function (t) { if (t.due && picked(t)) (byDay[t.due] = byDay[t.due] || []).push(t); });
    for (var i = 0; i < weeks * 7; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var key = ymd(d);
      var cell = el('button', 'day' + (d.getMonth() !== viewM ? ' other' : '') + (d.getDay() === 0 ? ' sun' : '') + (key === today() ? ' today' : '') + (key === sel ? ' sel' : ''));
      cell.type = 'button';
      cell.setAttribute('aria-label', key);
      cell.dataset.key = key;
      cell.appendChild(el('span', 'num' + (state.memos[key] ? ' hasmemo' : ''), d.getDate()));
      var items = (byDay[key] || []).slice().sort(function (a, b) { return (a.done - b.done) || (PRIO[a.prio][1] - PRIO[b.prio][1]); });
      var max = 4;
      items.slice(0, max).forEach(function (t) {
        var g = groupOf(t);
        var c = el('span', 'chip' + (t.done ? ' done' : ''), (t.dueTime ? t.dueTime + ' ' : '') + (t.cat === 'work' && clientById(t.client) ? '[' + g.name + '] ' : '') + t.text);
        c.style.background = g.color;
        c.title = t.text;
        cell.appendChild(c);
      });
      if (items.length > max) cell.appendChild(el('span', 'more', '+' + (items.length - max) + '개'));
      cell.onclick = function () { sel = this.dataset.key; var p = sel.split('-'); if (+p[1] - 1 !== viewM) { viewY = +p[0]; viewM = +p[1] - 1; } renderAll(); };
      grid.appendChild(cell);
    }
    var lg = $('legend'); lg.innerHTML = '';
    lg.className = 'legend' + (catPick ? ' filtering' : '');
    var item = function (key, color, label) {
      var b = el('button'); b.type = 'button';
      b.className = catPick === key ? 'on' : '';
      b.setAttribute('aria-pressed', catPick === key ? 'true' : 'false');
      b.title = catPick === key ? '다시 누르면 전체 보기' : label + '만 보기';
      var dt = el('i', 'dot'); dt.style.background = color;
      b.appendChild(dt); b.appendChild(document.createTextNode(label));
      b.onclick = function () { catPick = catPick === key ? '' : key; renderCal(); };
      lg.appendChild(b);
    };
    state.cats.forEach(function (c) { item('k:' + c.id, c.color, c.name); });
    state.clients.forEach(function (c) { item('c:' + c.id, c.color, '업무/' + c.name); });
    if (catPick) {
      var clr = el('button', 'clear', '전체 보기'); clr.type = 'button';
      clr.onclick = function () { catPick = ''; renderCal(); };
      lg.appendChild(clr);
    }
  }
  // 업무를 고르면 광고주 상관없이 업무 전부, 광고주를 고르면 그 광고주만
  function picked(t) {
    if (!catPick) return true;
    if (catPick.indexOf('k:') === 0) return t.cat === catPick.slice(2);
    return t.cat === 'work' && t.client === catPick.slice(2);
  }

  function sortTasks(list) {
    return list.slice().sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      var pa = PRIO[a.prio][1], pb = PRIO[b.prio][1];
      if (pa !== pb) return pa - pb;
      if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
      if ((a.dueTime || '') !== (b.dueTime || '')) return (a.dueTime || '99') < (b.dueTime || '99') ? -1 : 1;
      if (a.due || b.due) return a.due ? -1 : 1;
      return 0;
    });
  }

  function fillCatSelect(s, cur) {
    s.innerHTML = '';
    state.cats.forEach(function (c) { var o = el('option', '', c.name); o.value = c.id; s.appendChild(o); });
    var o = el('option', '', '미분류'); o.value = ''; s.appendChild(o);
    s.value = cur;
  }
  function fillClientSelect(s, cur) {
    s.innerHTML = '';
    var o = el('option', '', '광고주 없음'); o.value = ''; s.appendChild(o);
    state.clients.forEach(function (c) { var x = el('option', '', c.name); x.value = c.id; s.appendChild(x); });
    var n = el('option', '', '+ 새 광고주…'); n.value = '__new'; s.appendChild(n);
    s.value = cur || '';
  }
  function newClientFrom(s, onDone) {
    var name = (window.prompt('새 광고주 이름') || '').trim();
    if (!name) { s.value = ''; return; }
    var c = { id: uid(), name: name, color: CLIENT_COLORS[state.clients.length % CLIENT_COLORS.length] };
    state.clients.push(c); save();
    onDone(c.id);
  }

  function renderList() {
    $('dayTitle').textContent = md(sel) + ' (' + DOW[new Date(sel + 'T00:00').getDay()] + ')';
    var shown = sortTasks(state.todos.filter(function (t) { return t.due === sel; })).filter(function (t) {
      return status === 'all' || (status === 'done') === !!t.done;
    });
    var ul = $('list'); ul.innerHTML = '';
    if (!shown.length) ul.appendChild(el('div', 'empty', '이 날 할 일이 없어요. 위에서 추가해 보세요.'));
    shown.forEach(function (t) {
      var running = state.active && state.active.id === t.id;
      var li = el('li', 'task' + (t.done ? ' done' : '') + (running ? ' running' : ''));

      var cb = el('input'); cb.type = 'checkbox'; cb.checked = !!t.done; cb.setAttribute('aria-label', '완료 표시');
      cb.onchange = function () { if (cb.checked) completeTask(t); else { t.done = false; t.doneAt = ''; save(); renderAll(); } };

      var body = el('div');
      body.appendChild(el('div', 't', t.text));
      var meta = el('div', 'meta');
      var pr = el('select', 'pill p-' + t.prio); pr.setAttribute('aria-label', '우선순위');
      Object.keys(PRIO).forEach(function (k) { var o = el('option', '', PRIO[k][0]); o.value = k; pr.appendChild(o); });
      pr.value = t.prio;
      pr.onchange = function () { t.prio = pr.value; save(); renderAll(); };
      meta.appendChild(pr);
      var ct = el('select', 'pill'); ct.setAttribute('aria-label', '카테고리');
      fillCatSelect(ct, t.cat); ct.style.background = catById(t.cat).color;
      ct.onchange = function () { t.cat = ct.value; if (t.cat !== 'work') t.client = ''; save(); renderAll(); };
      meta.appendChild(ct);
      if (t.cat === 'work') {
        var cl = el('select', 'pill'); cl.setAttribute('aria-label', '광고주');
        fillClientSelect(cl, t.client);
        var cc = clientById(t.client); cl.style.background = cc ? cc.color : '#94a3b8';
        cl.onchange = function () {
          if (cl.value === '__new') return newClientFrom(cl, function (id) { t.client = id; save(); renderAll(); });
          t.client = cl.value; save(); renderAll();
        };
        meta.appendChild(cl);
      }
      if (t.due) {
        var late = !t.done && dueAt(t) < Date.now();
        meta.appendChild(el('span', late ? 'overdue' : '', (t.dueTime || '') + (late ? ' 마감 지남' : t.dueTime ? ' 마감' : '')));
      }
      body.appendChild(meta);

      var del = el('button', 'x', '×'); del.type = 'button'; del.setAttribute('aria-label', '삭제');
      del.onclick = function () {
        if (state.active && state.active.id === t.id) state.active = null;
        state.todos = state.todos.filter(function (x) { return x !== t; }); save(); renderAll();
      };

      var tr = el('div', 'timerow');
      if (!t.done) {
        var play = el('button', 'play' + (running ? ' on' : ''), running ? '⏸ 멈춤' : '▶ 시작'); play.type = 'button';
        play.onclick = function () { if (running) { stopTimer(); renderAll(); } else startTimer(t); };
        tr.appendChild(play);
      }
      var real = el('input'); real.type = 'number'; real.min = '0'; real.step = '1';
      real.value = Math.round(elapsedMin(t)) || ''; real.placeholder = '0';
      real.setAttribute('aria-label', '실제 걸린 시간(분)');
      real.disabled = running;
      real.onchange = function () {
        var v = Math.max(0, parseFloat(real.value) || 0);

  // ---------- 월간 리포트 ----------
  function monthKey(y, m) { return y + '-' + pad(m + 1); }
  function monthStats(mk) {
    var done = state.todos.filter(function (t) { return t.done && (t.doneAt || '').indexOf(mk) === 0; });
    var timed = done.filter(function (t) { return t.spentMin >= 1; });
    var spent = 0;
    state.todos.forEach(function (t) { (t.log || []).forEach(function (l) { if (l.date.indexOf(mk) === 0) spent += l.min; }); });
    var withEst = timed.filter(function (t) { return t.estMin; });
    var estSum = withEst.reduce(function (a, t) { return a + t.estMin; }, 0);
    var actSum = withEst.reduce(function (a, t) { return a + t.spentMin; }, 0);
    var inTime = withEst.filter(function (t) { return t.spentMin <= t.estMin; }).length;
    var withDue = done.filter(function (t) { return t.due; });
    var onTime = withDue.filter(function (t) { return t.doneAt <= t.due; }).length;
    return {
      done: done.length, timed: timed, spent: spent,
      ratio: estSum ? actSum / estSum : null, nEst: withEst.length,
      inTimeRate: withEst.length ? inTime / withEst.length : null,
      onTimeRate: withDue.length ? onTime / withDue.length : null, nDue: withDue.length
    };
  }
  // 반복하는 일: 같은 이름의 일에서 이번 달 평균과 그 전(이전 모든 달) 평균 비교
  function repeatStats(mk) {
    var groups = {};
    state.todos.forEach(function (t) {
      if (!t.done || !(t.spentMin >= 1) || !t.doneAt) return;
      var k = norm(t.text);
      (groups[k] = groups[k] || { name: t.text, cur: [], prev: [] });
      if (t.doneAt.indexOf(mk) === 0) groups[k].cur.push(t.spentMin);
      else if (t.doneAt < mk) groups[k].prev.push(t.spentMin);
    });
    var avg = function (a) { return a.reduce(function (x, y) { return x + y; }, 0) / a.length; };
    return Object.keys(groups).map(function (k) { return groups[k]; })
      .filter(function (g) { return g.cur.length && g.prev.length; })
      .map(function (g) { var c = avg(g.cur), p = avg(g.prev); return { name: g.name, cur: c, prev: p, n: g.cur.length, change: (p - c) / p }; })
      .sort(function (a, b) { return b.n - a.n; });
  }
  function pct(x) { return Math.round(x * 100) + '%'; }
  function deltaPP(cur, prev, higherIsGood) {
    if (cur === null || prev === null) return '';
    var d = Math.round((cur - prev) * 100);
    if (!d) return '지난달과 같아요';
    var good = higherIsGood ? d > 0 : d < 0;
    return '<span class="' + (good ? 'up' : 'down') + '">지난달보다 ' + (d > 0 ? '+' : '') + d + '%p</span>';
  }

  function renderReport() {
    var mk = monthKey(rY, rM), pd = new Date(rY, rM - 1, 1), pk = monthKey(pd.getFullYear(), pd.getMonth());
    $('rTitle').textContent = '📊 ' + rY + '년 ' + (rM + 1) + '월 리포트';
    var s = monthStats(mk), p = monthStats(pk), rep = repeatStats(mk);

    var k = $('rKpis'); k.innerHTML = '';
    var kpi = function (label, value, delta, note) {
      var b = el('div', 'kpi'); b.appendChild(el('div', 'l', label)); b.appendChild(el('div', 'v', value));
      var d = el('div', 'd'); d.innerHTML = delta || ''; if (note) d.appendChild(document.createTextNode((delta ? ' · ' : '') + note));
      b.appendChild(d); k.appendChild(b);
    };
    kpi('기록된 작업 시간', fmtMin(s.spent), '', p.spent ? '지난달 ' + fmtMin(p.spent) : '');
    kpi('예상 시간 안에 끝냄', s.inTimeRate === null ? '-' : pct(s.inTimeRate), deltaPP(s.inTimeRate, p.inTimeRate, true));
    kpi('마감 지킨 비율', s.onTimeRate === null ? '-' : pct(s.onTimeRate), deltaPP(s.onTimeRate, p.onTimeRate, true), s.nDue ? s.nDue + '개 중' : '');

    // 그룹별 시간 (log 기준) + 예상 대비
    var g = {};
    state.todos.forEach(function (t) {
      var gr = groupOf(t);
      (t.log || []).forEach(function (l) {
        if (l.date.indexOf(mk) !== 0) return;
        var x = g[gr.key] = g[gr.key] || { name: gr.name, color: gr.color, min: 0, ids: {}, est: 0, act: 0, nEst: 0 };
        x.min += l.min; x.ids[t.id] = true;
      });
    });
    s.timed.forEach(function (t) {
      if (!t.estMin) return;
      var gr = groupOf(t);
      var x = g[gr.key] = g[gr.key] || { name: gr.name, color: gr.color, min: 0, ids: {}, est: 0, act: 0, nEst: 0 };
      x.est += t.estMin; x.act += t.spentMin; x.nEst++;
    });
    var rows = Object.keys(g).map(function (key) { return g[key]; });
    var timeRows = rows.filter(function (r) { return r.min >= 1; }).sort(function (a, b) { return b.min - a.min; });
    var bars = $('rBars'); bars.innerHTML = '';
    if (!timeRows.length) bars.appendChild(el('div', 'empty', '기록된 시간이 없어요'));
    var max = timeRows.length ? timeRows[0].min : 1;
    timeRows.forEach(function (r) {
      var n = Object.keys(r.ids).length;
      var row = el('div', 'bar');
      var lab = el('span', 'lab'); var dt = el('i', 'dot'); dt.style.background = r.color; dt.style.marginRight = '6px';
      lab.appendChild(dt); lab.appendChild(document.createTextNode(r.name)); row.appendChild(lab);
      var tr = el('div', 'track'); var f = el('div', 'fill'); var w2 = r.min / max * 70;
      f.style.width = w2 + '%';
      var v = el('span', 'val', fmtMin(r.min) + ' · ' + n + '개 · 평균 ' + fmtMin(r.min / n));
      v.style.left = 'calc(' + w2 + '% + 6px)';
      tr.title = r.name + ': ' + fmtMin(r.min) + ', ' + n + '개';
      tr.appendChild(f); tr.appendChild(v); row.appendChild(tr);
      bars.appendChild(row);
    });

    var estRows = rows.filter(function (r) { return r.nEst; }).sort(function (a, b) { return b.act / b.est - a.act / a.est; });

    var rt = $('rRepeat'); rt.innerHTML = '';
    if (!rep.length) rt.innerHTML = '<tr><td class="empty">이전 달에도 했던 일을 이번 달에 다시 하면 여기에 나와요</td></tr>';
    else {
      rt.innerHTML = '<tr><th>일</th><th>이번 달</th><th>그 전</th><th>변화</th></tr>';
      rep.forEach(function (r) {
        var tr = document.createElement('tr');
        [r.name + (r.n > 1 ? ' ×' + r.n : ''), fmtMin(r.cur), fmtMin(r.prev), (r.change >= 0 ? '▼ ' + pct(r.change) + ' 빨라짐' : '▲ ' + pct(-r.change) + ' 늘어남')].forEach(function (c, i) {
          var td = el('td', '', c); if (i === 3) td.className = r.change >= 0 ? 'up' : 'down'; tr.appendChild(td);
        });
        rt.appendChild(tr);
      });
    }

    // 인사이트 문장
    var ins = [];
    if (timeRows.length) {
      var top = timeRows[0], total = timeRows.reduce(function (a, r) { return a + r.min; }, 0);
      ins.push('시간을 가장 많이 쓴 곳: ' + top.name + ' (전체의 ' + pct(top.min / total) + ', ' + fmtMin(top.min) + ')');
    }
    var worst = estRows.filter(function (r) { return r.act > r.est * 1.1; })[0];
    if (worst) ins.push(worst.name + ' 일은 예상보다 ' + pct(worst.act / worst.est - 1) + ' 더 걸려요. 다음엔 예상 시간을 넉넉히 잡아 보세요.');
    var best = estRows.filter(function (r) { return r.act <= r.est; }).slice(-1)[0];
    if (best) ins.push(best.name + ' 일은 예상 시간 안에 끝내고 있어요 👍');
    if (s.ratio !== null && p.ratio !== null) {
      var diff = Math.round((p.ratio - s.ratio) * 100);
      if (diff > 0) ins.push('예상 대비 실제 시간이 지난달보다 ' + diff + '%p 줄었어요. 계획이 점점 정확해지고 있어요.');
      else if (diff < 0) ins.push('예상 대비 실제 시간이 지난달보다 ' + (-diff) + '%p 늘었어요.');
    }
    var fast = rep.filter(function (r) { return r.change > 0.05; })[0];
    if (fast) ins.push('"' + fast.name + '" 예전 평균 ' + fmtMin(fast.prev) + ' → 이번 달 ' + fmtMin(fast.cur) + ', 빨라졌어요.');
    if (s.onTimeRate !== null && s.onTimeRate < 0.7) ins.push('마감을 지킨 비율이 ' + pct(s.onTimeRate) + '예요. 마감 미리 알림을 더 일찍(2일 전) 켜 보세요.');
    var noEst = s.timed.filter(function (t) { return !t.estMin; }).length;
    if (noEst && s.timed.length) ins.push('완료한 일 중 ' + noEst + '개는 예상 시간이 없어요. 예상을 적어야 "예상 대비" 분석이 정확해져요.');
    var ul = $('rInsights'); ul.innerHTML = '';
    if (!ins.length) ins.push('이 달에는 분석할 기록이 아직 없어요.');
    ins.forEach(function (x) { ul.appendChild(el('li', '', x)); });
  }

    ["일찍 자고 일찍 일어나는 사람은 건강하고 부유하고 현명해진다.", "벤저민 프랭클린"],
    ["한 사람에게는 작은 한 걸음이지만, 인류에게는 거대한 도약이다.", "닐 암스트롱"],
    ["나에게는 꿈이 있습니다.", "마틴 루서 킹"],
    ["신에게는 아직 열두 척의 배가 남아 있사옵니다.", "이순신"],
    ["죽고자 하면 살 것이고, 살고자 하면 죽을 것이다.", "이순신"],
    ["하루라도 책을 읽지 않으면 입안에 가시가 돋는다.", "안중근"],
    ["나는 우리나라가 세계에서 가장 아름다운 나라가 되기를 원한다.", "김구"],
    ["죽는 날까지 하늘을 우러러 한 점 부끄럼이 없기를.", "윤동주"],
    ["나는 살면서 실패하고, 또 실패했다. 그것이 내가 성공한 이유다.", "마이클 조던"],
    ["성공을 축하하는 것도 좋지만, 실패에서 교훈을 얻는 것이 더 중요하다.", "빌 게이츠"],
    ["배우고 때때로 익히면 또한 기쁘지 아니한가.", "공자"],
    ["세 사람이 길을 가면 그중에 반드시 내 스승이 있다.", "공자"],
    ["천 리 길도 한 걸음부터.", "노자"],
    ["하늘이 장차 큰일을 맡기려 할 때는 반드시 먼저 그 마음을 괴롭게 한다.", "맹자"],
    ["혼자서는 할 수 있는 일이 적지만, 함께라면 많은 일을 할 수 있다.", "헬렌 켈러"],
    ["발밑만 보지 말고 별을 올려다보라.", "스티븐 호킹"],
    ["배움을 멈추는 사람은 스무 살이든 여든 살이든 늙은 것이다.", "헨리 포드"],
    ["인생은 가까이서 보면 비극이지만, 멀리서 보면 희극이다.", "찰리 채플린"],
    ["나는 피와 노고와 눈물과 땀밖에 바칠 것이 없습니다.", "윈스턴 처칠"]
  ];
  function pickQuote(avoid) {
    var n = Math.floor(Math.random() * QUOTES.length);
    if (n === avoid) n = (n + 1) % QUOTES.length;
    try { localStorage.setItem('todo-last-quote', String(n)); } catch (e) {}
    return n;
  }
  var quoteIdx = pickQuote((function () { try { return parseInt(localStorage.getItem('todo-last-quote'), 10); } catch (e) { return -1; } })());
  function renderQuote() {
    $('qText').textContent = '“' + QUOTES[quoteIdx][0] + '”';
    $('qBy').textContent = '오늘의 한마디 · ' + QUOTES[quoteIdx][1];
  }
  $('quote').onclick = function () { quoteIdx = pickQuote(quoteIdx); renderQuote(); };

  // ---------- 이벤트 ----------
  function renderAll() {
    if (view === 'cal') { renderCal(); renderList(); renderMemo(); } else renderReport();
    tick();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.onclick = function () {
      view = b.dataset.view;
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.className = 'tab' + (x === b ? ' on' : ''); });
      $('viewCal').hidden = view !== 'cal'; $('viewReport').hidden = view !== 'report';
      renderAll();
    };
  });
  $('prev').onclick = function () { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderCal(); };
  $('next').onclick = function () { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderCal(); };
  $('todayBtn').onclick = function () { var d = new Date(); viewY = d.getFullYear(); viewM = d.getMonth(); sel = today(); renderAll(); };
  $('rPrev').onclick = function () { rM--; if (rM < 0) { rM = 11; rY--; } renderReport(); };
  $('rNext').onclick = function () { rM++; if (rM > 11) { rM = 0; rY++; } renderReport(); };
  $('status').onclick = function (e) { if (e.target.dataset.f) { status = e.target.dataset.f; renderList(); } };
  $('runStop').onclick = function () { stopTimer(); renderAll(); };
  $('runDone').onclick = function () { var t = state.active && byId(state.active.id); if (t) completeTask(t); };

  // 날짜가 바뀐 뒤 돌아오면 오늘로
  var lastDay = today();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    if (lastDay !== today()) {
      lastDay = today(); sel = lastDay;
      var d = new Date(); viewY = d.getFullYear(); viewM = d.getMonth();
      quoteIdx = pickQuote(quoteIdx); renderQuote();
    }
    renderAll(); checkDeadlines();
  });

  fillCatSelect($('fCat'), 'work');
  fillClientSelect($('fClient'), '');
  syncFormClient();
  renderQuote();
  renderAll();
  checkDeadlines();
  setInterval(tick, 1000);
  setInterval(function () { checkDeadlines(); if (view === 'cal' && state.active) renderList(); }, 30000);
</script>
</body>
</html>
