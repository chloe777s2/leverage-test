<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투두 리스트</title>
<style>
  :root{
    --bg:#ffe3ee; --card:#ffffff; --ink:#4a1f35; --muted:#9a6b82;
    --accent:#ff5c9d; --accent-d:#e0457f; --line:#f7d3e2; --soft:#fff3f8;
    --high:#e5383b; --mid:#ff8fb8; --low:#b79cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--ink); min-height:100vh;
    display:flex; justify-content:center; padding:20px 16px 40px;
    line-height:1.55; word-break:keep-all;
  }
  .wrap{width:100%; max-width:520px; display:flex; flex-direction:column; gap:16px}
  .card{background:var(--card); border-radius:20px; padding:28px 22px; box-shadow:0 10px 40px rgba(255,92,157,.25)}
  h1{font-size:26px; margin-bottom:4px}
  h2{font-size:20px; margin-bottom:4px}
  .sub{color:var(--muted); font-size:14px; margin-bottom:18px}
  form{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  input[type=text], input[type=date], select{
    padding:12px 14px; font-size:16px; font-family:inherit;
    border:1.5px solid var(--line); border-radius:12px; background:var(--soft); color:var(--ink);
  }
  input:focus, select:focus{outline:none; border-color:var(--accent)}
  input[type=text]{flex:1 1 100%; min-width:0}
  input[type=date], select{flex:1 1 0; min-width:0}
  button{font-family:inherit; cursor:pointer}
  .add{flex:1 1 100%; padding:12px 18px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; font-weight:700}
  .add:hover{background:var(--accent-d)}
  .filters{display:flex; gap:6px; margin-bottom:12px}
  .filters button{
    flex:1; padding:8px 0; border:1.5px solid var(--line); border-radius:10px;
    background:#fff; color:var(--muted); font-size:14px; font-weight:600;
  }
  .filters button.on{background:var(--ink); border-color:var(--ink); color:#fff}
  ul{list-style:none}
  li{display:flex; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line)}
  li input[type=checkbox]{width:20px; height:20px; accent-color:var(--accent); flex-shrink:0}
  li .body{flex:1; min-width:0}
  li .text{overflow-wrap:anywhere}
  li .meta{display:flex; gap:6px; align-items:center; margin-top:2px; font-size:12px; color:var(--muted)}
  li.done .text{color:var(--muted); text-decoration:line-through}
  .badge{display:inline-block; padding:1px 8px; border-radius:999px; color:#fff; font-size:11px; font-weight:700}
  .p-high{background:var(--high)} .p-mid{background:var(--mid)} .p-low{background:var(--low)}
  .cat{display:inline-block; padding:1px 8px; border-radius:999px; border:1.5px solid var(--accent); color:var(--accent-d); font-size:11px; font-weight:700}
  .catfilter{width:100%; margin-bottom:6px; padding:8px 12px; font-size:14px}
  .overdue{color:var(--high); font-weight:700}
  .icon{border:0; background:none; color:var(--muted); font-size:20px; line-height:1; padding:4px 8px}
  .icon:hover{color:var(--accent-d)}
  .empty{text-align:center; color:var(--muted); padding:28px 0; font-size:15px}
  .link{margin-top:14px; border:0; background:none; color:var(--muted); font-size:13px; text-decoration:underline}
  .daterow{display:flex; gap:8px; margin-bottom:12px}
  .daterow input{flex:1}
  .miss form{margin-bottom:8px}
  .miss input[type=text]{flex:1 1 0}
  .miss .add{flex:0 0 auto}
  .redo{font-size:12px; border:1.5px solid var(--line); background:#fff; color:var(--muted); border-radius:8px; padding:3px 8px}
  .redo:hover{border-color:var(--accent); color:var(--accent-d)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>할 일 목록</h1>
    <p class="sub" id="count"></p>
    <form id="form">
      <input type="text" id="input" placeholder="할 일을 입력하세요" maxlength="200" autocomplete="off">
      <input type="date" id="due" aria-label="마감일">
      <select id="cat" aria-label="카테고리">
        <option value="work">카테고리: 업무</option>
        <option value="study">카테고리: 공부</option>
        <option value="health">카테고리: 운동</option>
        <option value="life" selected>카테고리: 생활</option>
        <option value="etc">카테고리: 기타</option>
      </select>
      <select id="prio" aria-label="우선순위">
        <option value="high">우선순위: 높음</option>
        <option value="mid" selected>우선순위: 보통</option>
        <option value="low">우선순위: 낮음</option>
      </select>
      <button class="add" type="submit">추가</button>
    </form>
    <div class="filters" id="filters">
      <button data-f="all" class="on">전체</button>
      <button data-f="active">진행중</button>
      <button data-f="done">완료</button>
    </div>
    <select id="catFilter" aria-label="카테고리 필터" class="catfilter">
      <option value="all">모든 카테고리</option>
      <option value="work">업무</option>
      <option value="study">공부</option>
      <option value="health">운동</option>
      <option value="life">생활</option>
      <option value="etc">기타</option>
    </select>
    <ul id="list"></ul>
    <button class="link" id="clear">완료한 항목 모두 삭제</button>
  </div>

  <div class="card miss">
    <h2>그날 못한 일</h2>
    <p class="sub">날짜를 고르고, 그날 끝내지 못한 일을 적어두세요.</p>
    <div class="daterow">
      <input type="date" id="missDate" aria-label="날짜">
    </div>
    <form id="missForm">
      <input type="text" id="missInput" placeholder="못한 일과 이유를 적어보세요" maxlength="200" autocomplete="off">
      <button class="add" type="submit">기록</button>
    </form>
    <ul id="missList"></ul>
  </div>
</div>
<script>
  var KEY = 'todo-list-v2', OLD_KEY = 'todo-list-v1';
  var state = { todos: [], missed: [] };
  var filter = 'all';
  var CATS = { work: '업무', study: '공부', health: '운동', life: '생활', etc: '기타' };
  var catFilter = 'all';
  var PRIO = { high: ['높음', 0], mid: ['보통', 1], low: ['낮음', 2] };

  try {
    var raw = localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY);
    var parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) state.todos = parsed;          // v1: 배열만 저장돼 있었음
    else if (parsed) state = { todos: parsed.todos || [], missed: parsed.missed || [] };
  } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function sorted(list) {
    return list.slice().sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      var pa = PRIO[a.prio || 'mid'][1], pb = PRIO[b.prio || 'mid'][1];
      if (pa !== pb) return pa - pb;
      if (a.due && b.due) return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
      if (a.due || b.due) return a.due ? -1 : 1;                // 마감일 있는 항목 먼저
      return 0;
    });
  }

  function renderTodos() {
    var todos = state.todos;
    var left = todos.filter(function (t) { return !t.done; }).length;
    $('count').textContent = todos.length
      ? '남은 할 일 ' + left + '개 / 전체 ' + todos.length + '개'
      : '아직 할 일이 없어요';

    var shown = sorted(todos).filter(function (t) {
      return (filter === 'all' || (filter === 'done') === t.done) &&
             (catFilter === 'all' || (t.cat || 'etc') === catFilter);
    });

    var ul = $('list');
    ul.innerHTML = '';
    if (!shown.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '표시할 항목이 없어요';
      ul.appendChild(empty);
    }
    shown.forEach(function (t) {
      var li = document.createElement('li');
      if (t.done) li.className = 'done';

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.done;
      cb.setAttribute('aria-label', '완료 표시');
      cb.onchange = function () { t.done = cb.checked; save(); renderTodos(); };

      var body = document.createElement('div');
      body.className = 'body';
      var text = document.createElement('div');
      text.className = 'text';
      text.textContent = t.text;
      var meta = document.createElement('div');
      meta.className = 'meta';

      var p = t.prio || 'mid';
      var badge = document.createElement('span');
      badge.className = 'badge p-' + p;
      badge.textContent = PRIO[p][0];
      meta.appendChild(badge);

      var c = t.cat || 'etc';
      var cat = document.createElement('span');
      cat.className = 'cat';
      cat.textContent = CATS[c];
      meta.appendChild(cat);

      if (t.due) {
        var due = document.createElement('span');
        var late = !t.done && t.due < today();
        due.textContent = '마감 ' + t.due + (late ? ' (지남)' : '');
        if (late) due.className = 'overdue';
        meta.appendChild(due);
      }
      body.appendChild(text); body.appendChild(meta);

      var del = document.createElement('button');
      del.className = 'icon';
      del.type = 'button';
      del.textContent = '×';
      del.setAttribute('aria-label', '삭제');
      del.onclick = function () {
        state.todos = state.todos.filter(function (x) { return x !== t; });
        save(); renderTodos();
      };

      li.appendChild(cb); li.appendChild(body); li.appendChild(del);
      ul.appendChild(li);
    });

    Array.prototype.forEach.call($('filters').children, function (b) {
      b.className = b.dataset.f === filter ? 'on' : '';
    });
  }

  function renderMissed() {
    var date = $('missDate').value;
    var items = state.missed.filter(function (m) { return m.date === date; });
    var ul = $('missList');
    ul.innerHTML = '';
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '이 날 기록된 못한 일이 없어요';
      ul.appendChild(empty);
    }
    items.forEach(function (m) {
      var li = document.createElement('li');
      var body = document.createElement('div');
      body.className = 'body';
      var text = document.createElement('div');
      text.className = 'text';
      text.textContent = m.text;
      body.appendChild(text);

      var redo = document.createElement('button');
      redo.className = 'redo';
      redo.type = 'button';
      redo.textContent = '할 일로 추가';
      redo.onclick = function () {
        state.todos.push({ id: uid(), text: m.text, done: false, prio: 'mid', cat: 'etc', due: '' });
        save(); renderTodos();
      };

      var del = document.createElement('button');
      del.className = 'icon';
      del.type = 'button';
      del.textContent = '×';
      del.setAttribute('aria-label', '삭제');
      del.onclick = function () {
        state.missed = state.missed.filter(function (x) { return x !== m; });
        save(); renderMissed();
      };

      li.appendChild(body); li.appendChild(redo); li.appendChild(del);
      ul.appendChild(li);
    });
  }

  $('form').onsubmit = function (e) {
    e.preventDefault();
    var text = $('input').value.trim();
    if (!text) return;
    state.todos.push({ id: uid(), text: text, done: false, prio: $('prio').value, cat: $('cat').value, due: $('due').value });
    $('input').value = '';
    $('due').value = '';
    save(); renderTodos();
  };

  $('filters').onclick = function (e) {
    if (e.target.dataset.f) { filter = e.target.dataset.f; renderTodos(); }
  };

  $('catFilter').onchange = function () { catFilter = $('catFilter').value; renderTodos(); };

  $('clear').onclick = function () {
    state.todos = state.todos.filter(function (t) { return !t.done; });
    save(); renderTodos();
  };

  $('missDate').value = today();
  $('missDate').onchange = function () {
    if (!$('missDate').value) $('missDate').value = today();
    renderMissed();
  };
  $('missForm').onsubmit = function (e) {
    e.preventDefault();
    var text = $('missInput').value.trim();
    if (!text) return;
    state.missed.push({ id: uid(), date: $('missDate').value, text: text });
    $('missInput').value = '';
    save(); renderMissed();
  };

  renderTodos();
  renderMissed();
</script>
</body>
</html>
